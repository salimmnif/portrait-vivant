<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait vivant</title>
<style>
  :root {
    color-scheme: dark;
    --fond: #101012;
    --surface: #1a1a1d;
    --surface-haute: #26262a;
    --ligne: #34343a;
    --texte: #f3f1ec;
    --texte-doux: #a9a7a1;
    --accent: #e0b160;
    --accent-texte: #1d1608;
    --danger: #ef7a6c;
    --succes: #6fcf97;
    --ombre: 0 18px 50px rgb(0 0 0 / 0.35);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --fond: #f4f1ea;
      --surface: #fffdf9;
      --surface-haute: #ece8df;
      --ligne: #dcd7cc;
      --texte: #1c1b18;
      --texte-doux: #66635b;
      --accent: #a8741a;
      --accent-texte: #fffdf9;
      --danger: #b93d2d;
      --succes: #23804b;
      --ombre: 0 18px 50px rgb(60 50 30 / 0.14);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 14px;
    padding: 14px 20px 16px;
    background: var(--fond);
    color: var(--texte);
    font: 15px/1.4 var(--sans);
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* En-tête */
  header { display: flex; align-items: center; gap: 18px; min-height: 36px; }
  h1 { margin: 0; font: 500 23px/1 var(--serif); letter-spacing: 0.01em; white-space: nowrap; }
  #consigne { flex: 1; margin: 0; color: var(--texte-doux); text-align: center; min-width: 0; }
  #consigne strong { color: var(--texte); font-weight: 600; }
  #statut {
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    padding: 5px 12px; border: 1px solid var(--ligne); border-radius: 999px;
    color: var(--texte-doux); font-size: 13px; font-variant-numeric: tabular-nums;
  }
  #point { width: 8px; height: 8px; border-radius: 50%; background: var(--texte-doux); }
  #statut[data-etat="actif"] #point { background: var(--succes); }
  #statut[data-etat="alerte"] #point { background: var(--danger); }

  /* Les deux images */
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-height: 0; }
  .scene {
    position: relative; display: flex; align-items: center; justify-content: center;
    min-height: 0; overflow: hidden; background: #09090a; border-radius: 16px;
    box-shadow: var(--ombre);
  }
  .scene img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .scene img[hidden] { display: none; }
  .etiquette {
    position: absolute; top: 12px; left: 12px; padding: 3px 11px; border-radius: 999px;
    background: rgb(0 0 0 / 0.55); color: #f3f1ec; font-size: 13px;
    backdrop-filter: blur(6px);
  }
  #vide-camera {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 24px; color: #a9a7a1; text-align: center; max-width: 340px;
  }
  #vide-camera svg { width: 42px; height: 42px; stroke: currentColor; opacity: 0.7; }
  #vide-camera p { margin: 0; }
  #vie-privee { font-size: 13px; opacity: 0.8; }

  /* Dépôt d'image */
  #depot {
    position: absolute; inset: 10px; display: none; align-items: center; justify-content: center;
    padding: 24px; border: 2px dashed var(--accent); border-radius: 12px;
    background: rgb(10 10 10 / 0.72); color: #f3f1ec; font: 500 21px/1.3 var(--serif);
    text-align: center; backdrop-filter: blur(4px); pointer-events: none;
  }
  body.survol #depot { display: flex; }
  #depot small { display: block; margin-top: 8px; font: 14px/1.4 var(--sans); opacity: 0.85; }

  /* Commandes */
  footer {
    display: flex; align-items: center; gap: 18px; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--ligne); border-radius: 16px;
    min-width: 0;
  }
  .groupe { display: flex; align-items: center; gap: 10px; }
  .bouton {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 42px; padding: 0 18px; border: 1px solid var(--ligne); border-radius: 11px;
    background: var(--surface-haute); cursor: pointer; font-weight: 550; white-space: nowrap;
    transition: background 120ms, border-color 120ms, transform 120ms;
  }
  .bouton:hover:not(:disabled) { border-color: var(--accent); }
  .bouton:active:not(:disabled) { transform: translateY(1px); }
  .bouton:disabled { opacity: 0.45; cursor: not-allowed; }
  .bouton.principal { background: var(--accent); border-color: var(--accent); color: var(--accent-texte); }
  .bouton.principal:hover:not(:disabled) { filter: brightness(1.07); }
  kbd {
    padding: 0 6px; border: 1px solid currentColor; border-radius: 5px; font: 11px/1.5 var(--sans);
    opacity: 0.65;
  }

  #galerie {
    flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; overflow-x: auto;
    padding: 3px; scrollbar-width: thin;
  }
  .vignette {
    flex: none; height: 54px; aspect-ratio: 5 / 6; padding: 0; overflow: hidden; cursor: pointer;
    background: var(--surface-haute); border: 2px solid transparent; border-radius: 9px;
    transition: border-color 120ms;
  }
  .vignette:hover { border-color: var(--ligne); }
  .vignette[aria-pressed="true"] { border-color: var(--accent); }
  .vignette img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #ajouter {
    flex: none; display: flex; align-items: center; justify-content: center; gap: 7px;
    height: 54px; padding: 0 14px; border: 1.5px dashed var(--ligne); border-radius: 9px;
    background: none; color: var(--texte-doux); cursor: pointer; white-space: nowrap;
    transition: border-color 120ms, color 120ms;
  }
  #ajouter:hover { border-color: var(--accent); color: var(--texte); }
  #ajouter[aria-busy="true"] { cursor: progress; opacity: 0.7; }

  .reglage { display: flex; flex-direction: column; gap: 2px; width: 138px; font-size: 13px; color: var(--texte-doux); }
  .reglage span { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; height: 22px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .interrupteur { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texte-doux); cursor: pointer; white-space: nowrap; }
  .interrupteur input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }

  /* Message d'erreur */
  #alerte {
    position: fixed; left: 50%; bottom: 104px; transform: translate(-50%, 10px);
    max-width: min(560px, 90vw); padding: 11px 18px; border-radius: 11px;
    background: var(--surface-haute); border: 1px solid var(--danger); color: var(--texte);
    box-shadow: var(--ombre); opacity: 0; pointer-events: none; transition: opacity 160ms, transform 160ms;
  }
  #alerte.visible { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1000px) {
    html, body { height: auto; }
    body { grid-template-rows: auto auto auto; }
    main { grid-template-columns: 1fr; }
    .scene { aspect-ratio: 4 / 3; }
    footer { flex-wrap: wrap; position: sticky; bottom: 8px; box-shadow: var(--ombre); }
    #galerie { order: 5; flex-basis: 100%; }
    #consigne { display: none; }
    header { justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header>
    <h1>Portrait vivant</h1>
    <p id="consigne" aria-live="polite"></p>
    <div id="statut" data-etat="repos"><span id="point"></span><span id="statut-texte">Caméra éteinte</span></div>
  </header>

  <main>
    <section class="scene" aria-label="Votre image">
      <span class="etiquette">Vous</span>
      <img id="flux-webcam" alt="Image de votre webcam" hidden>
      <div id="vide-camera">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 10.5 21 7v10l-5.5-3.5"/><rect x="3" y="6" width="12.5" height="12" rx="2.5"/></svg>
        <p>Activez la caméra pour animer le portrait avec votre visage.</p>
        <p id="vie-privee">Tout reste sur cet ordinateur : aucune image n'est envoyée sur Internet.</p>
      </div>
    </section>
    <section class="scene" aria-label="Portrait animé">
      <span class="etiquette">Portrait</span>
      <img id="flux-portrait" src="/flux/portrait" alt="Portrait animé">
      <div id="depot">
        <div>Déposez votre portrait ici<small>Une œuvre du domaine public, ou la photo d'une personne qui a donné son accord.</small></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="groupe">
      <button id="camera" class="bouton principal" type="button">Activer la caméra</button>
      <button id="neutre" class="bouton" type="button" disabled>Visage neutre <kbd>N</kbd></button>
    </div>
    <div id="galerie" role="group" aria-label="Choisir un portrait">
      <button id="ajouter" type="button" title="Une œuvre du domaine public, ou la photo d'une personne qui a donné son accord">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span id="ajouter-texte">Déposer ou choisir une image</span>
      </button>
      <input id="fichier" type="file" accept="image/*" hidden>
    </div>
    <label class="reglage">
      <span>Intensité <output id="intensite-valeur">1,0</output></span>
      <input id="intensite" type="range" min="0" max="2" step="0.1" value="1">
    </label>
    <label class="interrupteur"><input id="debug" type="checkbox">Repères</label>
  </footer>

  <div id="alerte" role="alert"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const INTERVALLE_ETAT_MS = 400;
  let etat = null;
  let reglageEnCours = false;
  let nbVignettes = 0;
  let minuteurAlerte = null;
  let envoiEnCours = false;

  const texteDecimal = (valeur) => Number(valeur).toFixed(1).replace(".", ",");

  function montrerAlerte(message) {
    const alerte = $("alerte");
    alerte.textContent = message;
    alerte.classList.add("visible");
    clearTimeout(minuteurAlerte);
    minuteurAlerte = setTimeout(() => alerte.classList.remove("visible"), 5000);
  }

  async function envoyer(chemin, corps, entetes = {}) {
    const estBinaire = corps instanceof Blob;
    try {
      const reponse = await fetch(chemin, {
        method: "POST",
        headers: estBinaire ? entetes : { "Content-Type": "application/json", ...entetes },
        body: estBinaire ? corps : JSON.stringify(corps ?? {}),
      });
      const resultat = await reponse.json();
      if (!resultat.ok && resultat.message) montrerAlerte(resultat.message);
      return resultat.ok;
    } catch {
      montrerAlerte("Le programme ne répond plus : relancez interface.py.");
      return false;
    }
  }

  function consigne() {
    if (!etat.camera_demandee) return "<strong>Choisissez un portrait</strong>, puis activez la caméra.";
    if (!etat.camera_active) return "Ouverture de la caméra…";
    if (!etat.visage) return "<strong>Placez votre visage</strong> face à la caméra.";
    if (!etat.neutre) return "Visage détendu, puis appuyez sur <strong>Visage neutre</strong>.";
    return "<strong>À vous de jouer :</strong> grimacez, le portrait vous imite.";
  }

  function afficherStatut() {
    const statut = $("statut");
    if (!etat.camera_active) {
      statut.dataset.etat = "repos";
      $("statut-texte").textContent = etat.camera_demandee ? "Ouverture…" : "Caméra éteinte";
    } else if (!etat.visage) {
      statut.dataset.etat = "alerte";
      $("statut-texte").textContent = "Aucun visage";
    } else {
      statut.dataset.etat = "actif";
      $("statut-texte").textContent = `${Math.round(etat.fps)} images/s`;
    }
  }

  function afficherGalerie() {
    if (etat.portraits.length !== nbVignettes) {
      const galerie = $("galerie");
      galerie.querySelectorAll(".vignette").forEach((v) => v.remove());
      etat.portraits.forEach((nom, indice) => {
        const bouton = document.createElement("button");
        bouton.className = "vignette";
        bouton.type = "button";
        bouton.title = nom;
        bouton.setAttribute("aria-label", `Portrait ${nom}`);
        const image = document.createElement("img");
        image.src = `/miniatures/${indice}`;
        image.alt = "";
        bouton.append(image);
        bouton.addEventListener("click", () => choisirPortrait(indice));
        galerie.insertBefore(bouton, $("ajouter"));
      });
      nbVignettes = etat.portraits.length;
    }
    document.querySelectorAll(".vignette").forEach((v, i) => {
      const actif = i === etat.indice;
      if (actif && v.getAttribute("aria-pressed") !== "true") {
        // Seule la galerie défile : la page reste à sa place.
        const galerie = $("galerie");
        const gauche = v.offsetLeft - galerie.offsetLeft;
        if (gauche < galerie.scrollLeft) galerie.scrollLeft = gauche;
        else if (gauche + v.offsetWidth > galerie.scrollLeft + galerie.clientWidth) {
          galerie.scrollLeft = gauche + v.offsetWidth - galerie.clientWidth;
        }
      }
      v.setAttribute("aria-pressed", String(actif));
    });
  }

  function afficher() {
    $("consigne").innerHTML = consigne();
    afficherStatut();
    afficherGalerie();

    const fluxActif = etat.camera_active;
    const flux = $("flux-webcam");
    if (fluxActif && flux.hidden) {
      flux.src = `/flux/webcam?t=${Date.now()}`;
      flux.hidden = false;
      $("vide-camera").style.display = "none";
    } else if (!fluxActif && !flux.hidden) {
      flux.removeAttribute("src");
      flux.hidden = true;
      $("vide-camera").style.display = "";
    }

    const camera = $("camera");
    camera.textContent = etat.camera_demandee ? "Arrêter la caméra" : "Activer la caméra";
    camera.classList.toggle("principal", !etat.camera_demandee);
    const neutre = $("neutre");
    neutre.disabled = !etat.camera_active || !etat.visage;
    neutre.classList.toggle("principal", etat.camera_active && etat.visage && !etat.neutre);

    if (!reglageEnCours) {
      $("intensite").value = etat.intensite;
      $("intensite-valeur").textContent = texteDecimal(etat.intensite);
    }
    $("debug").checked = etat.debug;
  }

  async function actualiser() {
    try {
      const reponse = await fetch("/etat");
      etat = await reponse.json();
      if (etat.erreur) montrerAlerte(etat.erreur);
      afficher();
    } catch { /* le message apparaît à la prochaine action */ }
    setTimeout(actualiser, INTERVALLE_ETAT_MS);
  }

  const choisirPortrait = (indice) => envoyer(`/portraits/${indice}`);
  const basculerCamera = () => etat && envoyer("/camera", { active: !etat.camera_demandee });
  const enregistrerNeutre = () => envoyer("/neutre");

  async function ajouterImage(fichier) {
    if (!fichier || envoiEnCours) return;
    if (!fichier.type.startsWith("image/")) {
      montrerAlerte("Ce fichier n'est pas une image.");
      return;
    }
    envoiEnCours = true;
    $("ajouter").setAttribute("aria-busy", "true");
    $("ajouter-texte").textContent = "Analyse…";
    await envoyer("/portraits", fichier, { "X-Nom-Fichier": encodeURIComponent(fichier.name) });
    $("ajouter").removeAttribute("aria-busy");
    $("ajouter-texte").textContent = "Déposer ou choisir une image";
    envoiEnCours = false;
  }

  function changerIntensite(valeur) {
    const bornee = Math.min(Math.max(valeur, 0), etat ? etat.intensite_max : 2);
    $("intensite").value = bornee;
    $("intensite-valeur").textContent = texteDecimal(bornee);
    envoyer("/intensite", { valeur: bornee });
  }

  $("camera").addEventListener("click", basculerCamera);
  $("neutre").addEventListener("click", enregistrerNeutre);
  $("ajouter").addEventListener("click", () => $("fichier").click());
  $("fichier").addEventListener("change", (e) => { ajouterImage(e.target.files[0]); e.target.value = ""; });
  $("debug").addEventListener("change", (e) => envoyer("/debug", { actif: e.target.checked }));
  const curseur = $("intensite");
  curseur.addEventListener("pointerdown", () => { reglageEnCours = true; });
  curseur.addEventListener("pointerup", () => { reglageEnCours = false; });
  curseur.addEventListener("input", () => changerIntensite(Number(curseur.value)));

  // Glisser-déposer : toute la page accepte une image.
  let profondeurSurvol = 0;
  window.addEventListener("dragenter", (e) => { e.preventDefault(); profondeurSurvol++; document.body.classList.add("survol"); });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("dragleave", () => { if (--profondeurSurvol <= 0) { profondeurSurvol = 0; document.body.classList.remove("survol"); } });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    profondeurSurvol = 0;
    document.body.classList.remove("survol");
    ajouterImage(e.dataTransfer.files[0]);
  });

  // Raccourcis clavier, comme dans la version OpenCV.
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || !etat) return;
    const touche = e.key.toLowerCase();
    if (touche === "n" && !$("neutre").disabled) enregistrerNeutre();
    else if (touche === "o") $("fichier").click();
    else if (touche === "p") choisirPortrait((etat.indice + 1) % etat.portraits.length);
    else if (touche === "d") envoyer("/debug", { actif: !etat.debug });
    else if (touche === "+" || touche === "=") changerIntensite(Number(curseur.value) + 0.1);
    else if (touche === "-") changerIntensite(Number(curseur.value) - 0.1);
  });

  actualiser();
</script>
</body>
</html>
